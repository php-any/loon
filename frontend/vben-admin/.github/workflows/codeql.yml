# 对于大多数项目，此工作流文件无需修改；只需
# 将其提交到仓库。
#
# 如需覆盖待分析的语言集合，或提供自定义查询和构建逻辑，
# 可以修改此文件。
#
# ******** 注意 ********
# 已尝试检测仓库中的语言。请检查
# 下方定义的 `language` 矩阵，确认其中包含正确的
# CodeQL 支持语言。
#
name: 'CodeQL'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '35 0 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.repository == 'vbenjs/vue-vben-admin'
    # 运行器规格会影响 CodeQL 分析时间。详情请参阅：
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners （仅限 GitHub.com）
    # 可考虑使用更大规格的运行器或资源更充足的机器来缩短分析时间。
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      # 所有工作流均需要
      security-events: write

      # 获取内部或私有 CodeQL 包需要此权限
      packages: read

      # 仅私有仓库中的工作流需要
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
        # CodeQL 的 language 支持以下值：'c-cpp'、'csharp'、'go'、'java-kotlin'、'javascript-typescript'、'python'、'ruby'、'swift'
        # 使用 `c-cpp` 分析 C、C++ 或两者混合的代码
        # 使用 'java-kotlin' 分析 Java、Kotlin 或两者混合的代码
        # 使用 'javascript-typescript' 分析 JavaScript、TypeScript 或两者混合的代码
        # 有关更改分析语言或自定义分析构建模式的更多信息，
        # 请参阅 https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning。
        # 分析编译型语言时，可以修改该语言的 'build-mode'，以自定义
        # 代码库的分析方式，参阅 https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 初始化用于扫描的 CodeQL 工具。
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # 可以在此处或配置文件中指定自定义查询。
          # 默认情况下，此处列出的查询会覆盖配置文件中指定的查询。
          # 在此处的列表前加上 "+"，即可同时使用两处的查询。

          # CodeQL 查询包详情请参阅：https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
          # queries: security-extended,security-and-quality

      # 如果某种语言的分析步骤失败，提示
      # "We were unable to automatically build your code"，请修改上方矩阵，
      # 将该语言的构建模式设为 "manual"，然后修改此步骤
      # 以构建代码。
      # ℹ️ 通过操作系统 shell 运行的命令行程序。
      # 📚 参阅 https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
      - if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'If you are using a "manual" build mode for one or more of the' \
            'languages you are analyzing, replace this with the commands to build' \
            'your code, for example:'
          echo '  make bootstrap'
          echo '  make release'
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{matrix.language}}'
