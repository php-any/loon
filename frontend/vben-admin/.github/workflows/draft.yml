name: Release Drafter

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  update_release_draft:
    permissions:
      # 创建 GitHub 发布需要写入权限
      contents: write
      # 自动标注器需要写入权限
      # 否则至少需要读取权限
      pull-requests: write
    if: github.repository == 'vbenjs/vue-vben-admin'
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
