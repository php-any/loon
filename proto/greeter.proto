syntax = "proto3";
package loom.examples;

import "google/protobuf/wrappers.proto";
import "common/greeting.proto";

// All methods are registered dynamically from this contract.
// SayHello retains the original wrapper-message wire contract.
service Greeter {
  rpc SayHello(google.protobuf.StringValue) returns (google.protobuf.StringValue);
  rpc Greet(GreetRequest) returns (GreetReply);
  rpc BatchGreet(BatchGreetRequest) returns (BatchGreetReply);
}

message GreetRequest { string name = 1; optional int32 times = 2; }
message GreetReply { repeated loom.examples.common.Greeting greetings = 1; }
message BatchGreetRequest { repeated string names = 1; }
message BatchGreetReply { repeated loom.examples.common.Greeting greetings = 1; int32 count = 2; }
